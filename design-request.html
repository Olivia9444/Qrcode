
<!DOCTYPE >
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Design Request</title>

    <link rel="stylesheet" href="style.css">
    <script async src="https://js.stripe.com/v3/buy-button.js"></script>
</head>

<body>

<header class="hero">

<h1>Custom Design Request</h1>

<p>
Have an idea? Request to customize a current project below. We'll review your request and contact you with pricing and the next steps.
</p>

</header>


<section class="product">

<form action="https://formsubmit.co/exnihilomakerscommunity@gmail.com" method="POST">

<div>

<label for="name">Full Name</label>
<input type="text" id="name" name="Name" required>

</div>

<div>

<label for="email">Email Address</label>
<input type="email" id="email" name="Email" required>

</div>

<div>

<label for="project">
What would you like designed?
</label>

<textarea id="project" name="Project Description"></textarea>

</div>

<div>

<label for="size">
Approximate Size
</label>

<input type="text" id="size" name="Approximate Size">

</div>

<div>

<label for="material">
Preferred Material
</label>

<select id="material" name="Material">

<option>PLA</option>
<option>PETG</option>
<option>TPU</option>

</select>

</div>

<div>

<label for="color">
Preferred Color
</label>

<input type="text" id="color" name="Color">

</div>

<div>

<label>
Do you already have a sketch?
</label>

<div class="radio-group">

<label>
<input type="radio" name="Sketch" value="Yes">
Yes
</label>

<label>
<input type="radio" name="Sketch" value="No">
No
</label>

</div>

</div>

<div>

<label>
Need Shipping?
</label>

<div class="radio-group">

<label>
<input type="radio" name="Shipping" value="Yes">
Yes
</label>

<label>
<input type="radio" name="Shipping" value="No">
No
</label>

</div>

</div>

<div>

<label for="date">
Desired Completion Date
</label>

<input type="date" id="date" name="Completion Date">

</div>

<button type="submit">
Submit Design Request
</button>

</form>

</section>

</body>

</html>
