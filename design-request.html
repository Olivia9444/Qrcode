
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Design Request</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">

<h1>Custom Design Request</h1>

<p>
Have an idea? Tell us about your project below. We'll review your request and contact you with pricing and the next steps.
</p>

</header>


<section class="product">

<form action="https://formsubmit.co/exnihilomakerscommunity@gmail.com" method="POST">

<label for="name">Full Name</label>
<input type="text" id="name" name="Name" required>


<label for="email">Email Address</label>
<input type="email" id="email" name="Email" required>


<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="Phone">


<label for="project">What would you like designed?</label>
<textarea id="project"
name="Project Description"
rows="5"
required></textarea>


<label for="size">Approximate Size</label>
<input
type="text"
id="size"
name="Approximate Size"
placeholder="Example: 6 inches tall">


<label for="material">Preferred Material</label>

<select id="material" name="Preferred Material">

<option value="">Select One</option>

<option>PLA</option>

<option>PETG</option>

<option>TPU</option>

</select>


<label for="color">Preferred Color</label>

<input
type="text"
id="color"
name="Preferred Color"
placeholder="Purple, Black, White, Silk Gold...">


<label>Do you already have a sketch?</label>

<input type="radio" id="yesSketch" name="Sketch" value="Yes">
<label for="yesSketch">Yes</label>

<input type="radio" id="noSketch" name="Sketch" value="No">
<label for="noSketch">No</label>


<label>Need Shipping?</label>

<input type="radio" id="shipYes" name="Shipping" value="Yes">
<label for="shipYes">Yes</label>

<input type="radio" id="shipNo" name="Shipping" value="No">
<label for="shipNo">No</label>


<label for="date">Desired Completion Date</label>

<input
type="date"
id="date"
name="Desired Completion Date">


<label for="notes">Additional Notes</label>

<textarea
id="notes"
name="Additional Notes"
rows="6"></textarea>


<button type="submit">
Submit Design Request
</button>

</form>

</section>

</body>

</html>
